services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medical_services
      POSTGRES_USER: msd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MsdProd_ChangeMe_2026!}
    volumes:
      - msd_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msd -d medical_services"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./src
      dockerfile: ../Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=medical_services;Username=msd;Password=${POSTGRES_PASSWORD:-MsdProd_ChangeMe_2026!}
      Jwt__Key: ${JWT_KEY:-MSD_Prod_Jwt_Signing_Key_Must_Be_32_Chars_Min!}
      Jwt__Issuer: MedicalServicesDirectorate
      Jwt__Audience: MedicalServicesClients
      Deployment__SeedDemoAccounts: "true"
      Deployment__ShowDemoLogins: "true"
    ports:
      - "8080:8080"
volumes:
  msd_pg:
